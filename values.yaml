replicaCount: 2

image:
  repository: app
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP   # use ClusterIP when exposing via Ingress
  port: 80

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: myapp.local
      paths:
        - path: /
          pathType: Prefix


